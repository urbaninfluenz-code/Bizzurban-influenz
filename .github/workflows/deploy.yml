name: Deploy SONIX to GitHub Pages

on:
  push:
    branches: [main, claude/audio-effects-app-8udIX]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/audio-effects-app-8udIX

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd dist
          git init
          git add -A
          git commit -m "Deploy SONIX"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/urbaninfluenz-code/Bizzurban-influenz.git HEAD:gh-pages
